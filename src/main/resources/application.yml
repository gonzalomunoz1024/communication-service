spring:
  application:
    name: communication-service
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
  data:
    mongodb:
      uri: mongodb://localhost:27017/communication
      auto-index-creation: true

server:
  port: 8080

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

communication:
  sweep:
    interval-ms: 30000
  feed:
    default-page-size: 20
    max-page-size: 100
    upcoming-window: P7D
  limits:
    title-max: 200
    body-max-bytes: 16384
  health:
    # how often the scheduler looks for monitors due for a probe / stale push-only services
    sweep-interval-ms: 5000
    # policy a monitor inherits for anything not set at registration
    defaults:
      publisher: health-monitor
      interval-seconds: 30
      timeout-ms: 5000
      failure-threshold: 2
      recovery-threshold: 2
      down-severity: MAJOR
      degraded-severity: MINOR
      audience: CUSTOMERS
