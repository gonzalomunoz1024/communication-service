spring:
  application:
    name: communication-service
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
  data:
    mongodb:
      uri: mongodb://localhost:27017/communication
      auto-index-creation: true

server:
  port: 8080

# Operations: only the health endpoint is exposed, outside /v1 so it needs no client id. Liveness is
# the process itself; readiness also asks Mongo, so a pod whose database is unreachable stops
# receiving traffic without being restarted. Details stay hidden: the endpoint is unauthenticated.
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        readiness:
          include: readinessState,mongo

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

communication:
  client-id:
    # every /v1 request must name its caller (repository name) in X-Client-Id, or ?clientId= for
    # EventSource clients; identification only, nothing is verified. Set false for local experiments.
    required: true
  mongo:
    # how long a call waits for the database before giving up: with the driver's own defaults (30 s
    # to find a server, no socket timeouts) every request and the readiness probe hang that long
    # while Mongo is unreachable. A call that gives up answers 503 {"error":"database unavailable"},
    # readiness reports DOWN and each scheduler logs one WARN line per skipped run. These win over
    # the same options given on the URI.
    server-selection-timeout: PT5S
    connect-timeout: PT5S
    read-timeout: PT15S
  events:
    # shared event log (communication_events): every instance appends to it and tails it, so SSE
    # subscribers on any node see every event; a client reconnecting with Last-Event-ID gets what
    # it missed while the log still holds it
    poll-interval-ms: 500
    retention: P1D
  tickets:
    # a communication may carry the ServiceNow incident behind it (ticket.number); this is what an
    # incident number looks like, checked after trimming and upper-casing
    number-pattern: 'INC\d{7}'
  servicenow:
    # optional: your instance, e.g. https://acme.service-now.com. When set, a ServiceNow ticket that
    # comes without a url gets a link to the incident. Nothing is called; syncing the ticket's status
    # is a later, separate switch.
    instance-url:
  sweep:
    interval-ms: 30000
  feed:
    upcoming-window: P7D
  health:
    # how often the scheduler looks for monitors due for a probe / stale push-only services
    sweep-interval-ms: 5000
    # silent services are not declared DOWN this long after this service starts (our own
    # restart must not read as everyone's outage)...
    stale-grace-after-start-ms: 300000
    # ...nor while more than this share of the monitors that can go stale are silent at once
    # (services scaled to zero, whose pods all said goodbye, count on neither side)...
    stale-pause-fraction: 0.3
    # ...provided at least this many are silent: one silent service out of three is 33%, not
    # "everyone", and is declared DOWN
    stale-pause-min-silent: 2
    # policy a monitor inherits for anything not set at registration
    defaults:
      publisher: health-monitor
      interval-seconds: 30
      timeout-ms: 5000
      failure-threshold: 2
      recovery-threshold: 2
      down-severity: MAJOR
      degraded-severity: MINOR
      audience: CUSTOMERS
      # for services that report per pod (the health sidecar): share of live pods that must be
      # UP for the service to count as UP, and the staleness window their monitors get
      min-healthy-percent: 50
      instance-stale-after-seconds: 90
