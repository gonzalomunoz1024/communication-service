de:
  flapdoodle:
    mongodb:
      embedded:
        version: 7.0.14

spring:
  # this file shadows the shipped application.yml: the same Jackson 3 settings keep the wire format
  # the tests were written for (see src/main/resources/application.yml)
  jackson:
    mapper:
      sort-properties-alphabetically: false
    deserialization:
      fail-on-null-for-primitives: false
      fail-on-trailing-tokens: false
    json:
      write:
        combine-unicode-surrogates-in-utf8: false
  data:
    mongodb:
      auto-index-creation: true

management:
  endpoints:
    jackson:
      # as in src/main/resources/application.yml: actuator bodies use the application's JSON settings
      isolated-json-mapper: false
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        readiness:
          include: readinessState,mongo

communication:
  client-id:
    # HTTP tests send X-Client-Id; ClientIdWebFilterTest covers the rejections
    required: true
  events:
    poll-interval-ms: 100
    retention: P1D
  tickets:
    number-pattern: 'INC\d{7}'
  servicenow:
    instance-url: https://acme.service-now.com
  sweep:
    interval-ms: 60000
  feed:
    upcoming-window: P7D
  health:
    # tests drive probes explicitly; keep the scheduler out of the way
    sweep-interval-ms: 3600000
    defaults:
      publisher: health-monitor
      interval-seconds: 30
      timeout-ms: 5000
      failure-threshold: 2
      recovery-threshold: 2
      down-severity: MAJOR
      degraded-severity: MINOR
      audience: CUSTOMERS
