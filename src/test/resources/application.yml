de:
  flapdoodle:
    mongodb:
      embedded:
        version: 7.0.14

spring:
  data:
    mongodb:
      auto-index-creation: true

communication:
  sweep:
    interval-ms: 60000
  feed:
    default-page-size: 20
    max-page-size: 100
    upcoming-window: P7D
  health:
    # tests drive probes explicitly; keep the scheduler out of the way
    sweep-interval-ms: 3600000
    defaults:
      publisher: health-monitor
      interval-seconds: 30
      timeout-ms: 5000
      failure-threshold: 2
      recovery-threshold: 2
      down-severity: MAJOR
      degraded-severity: MINOR
      audience: CUSTOMERS
