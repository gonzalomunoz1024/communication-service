# End to end: the browser, the backend and the health sidecar together, as e2e/README.md describes.
name: e2e

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Playwright over the compose stack
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json

      - name: Build the backend jar
        run: ./gradlew bootJar --no-daemon

      - name: Build the frontend bundle
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Build the stack's images
        working-directory: e2e
        run: ./stack.sh build

      - name: Install the suite and its browser
        working-directory: e2e
        run: |
          npm ci
          npm run typecheck
          npx playwright install --with-deps chromium

      - name: Start the stack
        working-directory: e2e
        run: ./stack.sh up

      - name: Run the suite
        working-directory: e2e
        run: npx playwright test

      - name: Stack logs
        if: failure()
        working-directory: e2e
        run: ./stack.sh logs

      - name: Stop the stack
        if: always()
        working-directory: e2e
        run: ./stack.sh down

      - name: Upload the report and the traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: |
            e2e/playwright-report
            e2e/test-results
          if-no-files-found: ignore
          retention-days: 14
