# Test fixture: an app that already has an init container and a StatefulSet, plus the native
# component. Used by deploy_test.go to prove the component keeps existing init containers.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - workloads.yaml

components:
  - ../../kustomize/component-native

configMapGenerator:
  - name: cs-health-sidecar
    options:
      disableNameSuffixHash: true
    literals:
      - CS_ENDPOINT=https://communication.apps.example.com
      - CS_TENANT=retail
