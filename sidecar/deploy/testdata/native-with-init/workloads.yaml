apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments-api
  labels:
    app.kubernetes.io/name: payments-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: payments-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: payments-api
        app.kubernetes.io/version: "1.4.2"
    spec:
      initContainers:
        - name: db-migrate
          image: registry.example.com/retail/payments-api:1.4.2
          command: ["./migrate"]
      containers:
        - name: payments-api
          image: registry.example.com/retail/payments-api:1.4.2
          ports:
            - containerPort: 8080
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ledger
  labels:
    app.kubernetes.io/name: ledger
spec:
  serviceName: ledger
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: ledger
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ledger
    spec:
      initContainers:
        - name: fetch-config
          image: registry.example.com/retail/ledger:2.0.0
          command: ["./fetch-config"]
      containers:
        - name: ledger
          image: registry.example.com/retail/ledger:2.0.0
          ports:
            - containerPort: 8080
