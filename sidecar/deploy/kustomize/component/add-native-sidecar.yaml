# Native sidecar form for OpenShift 4.16+ (Kubernetes 1.29+): an init container with
# restartPolicy: Always starts before the app and is stopped after it, and never keeps a Job
# running. Swap this file for add-sidecar.yaml in kustomization.yaml to use it.
- op: add
  path: /spec/template/spec/initContainers
  value: []
- op: add
  path: /spec/template/spec/initContainers/-
  value:
    name: health-sidecar
    image: registry.example.com/platform/health-sidecar:1.0.0
    imagePullPolicy: IfNotPresent
    restartPolicy: Always
    envFrom:
      - configMapRef:
          name: cs-health-sidecar
    env:
      - name: POD_NAME
        valueFrom:
          fieldRef:
            fieldPath: metadata.name
      - name: POD_NAMESPACE
        valueFrom:
          fieldRef:
            fieldPath: metadata.namespace
      - name: NODE_NAME
        valueFrom:
          fieldRef:
            fieldPath: spec.nodeName
      - name: CS_SERVICE
        valueFrom:
          fieldRef:
            fieldPath: metadata.labels['app.kubernetes.io/name']
      - name: CS_VERSION
        valueFrom:
          fieldRef:
            fieldPath: metadata.labels['app.kubernetes.io/version']
    ports:
      - name: cs-status
        containerPort: 9465
        protocol: TCP
    livenessProbe:
      httpGet:
        path: /healthz
        port: cs-status
      periodSeconds: 30
    resources:
      requests:
        cpu: 10m
        memory: 16Mi
      limits:
        cpu: 50m
        memory: 32Mi
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      runAsNonRoot: true
      capabilities:
        drop: ["ALL"]
      seccompProfile:
        type: RuntimeDefault
