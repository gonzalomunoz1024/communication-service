# Appends the sidecar container. On OpenShift 4.16+ you may prefer the native sidecar form
# (an init container with restartPolicy: Always): use the ../component-native component instead.
- op: add
  path: /spec/template/spec/containers/-
  value:
    name: health-sidecar
    image: registry.example.com/platform/health-sidecar:1.0.0
    imagePullPolicy: IfNotPresent
    envFrom:
      - configMapRef:
          name: cs-health-sidecar
    env:
      - name: POD_NAME
        valueFrom:
          fieldRef:
            fieldPath: metadata.name
      - name: POD_NAMESPACE
        valueFrom:
          fieldRef:
            fieldPath: metadata.namespace
      - name: NODE_NAME
        valueFrom:
          fieldRef:
            fieldPath: spec.nodeName
      # Service name from the standard label; falls back to the workload name derived from the pod name.
      - name: CS_SERVICE
        valueFrom:
          fieldRef:
            fieldPath: metadata.labels['app.kubernetes.io/name']
      - name: CS_VERSION
        valueFrom:
          fieldRef:
            fieldPath: metadata.labels['app.kubernetes.io/version']
    ports:
      - name: cs-status
        containerPort: 9465
        protocol: TCP
    livenessProbe:
      httpGet:
        path: /healthz
        port: cs-status
      periodSeconds: 30
    resources:
      requests:
        cpu: 10m
        memory: 16Mi
      limits:
        cpu: 50m
        memory: 32Mi
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      runAsNonRoot: true
      capabilities:
        drop: ["ALL"]
      seccompProfile:
        type: RuntimeDefault
