# Fallback for teams that manage plain YAML. Two pieces are the sidecar's: the cs-health-sidecar
# ConfigMap below (CS_ENDPOINT, CS_TENANT and, optionally, CS_CLUSTER), applied in the app's
# namespace, and the "health-sidecar" container, pasted into the pod spec; without the ConfigMap
# the container cannot start (CreateContainerConfigError). The rest of the Deployment is the
# team's own.
apiVersion: v1
kind: ConfigMap
metadata:
  name: cs-health-sidecar
data:
  CS_ENDPOINT: https://communication.apps.example.com
  CS_TENANT: retail
  CS_CLUSTER: ocp-east
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments-api
  labels:
    app.kubernetes.io/name: payments-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: payments-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: payments-api
        app.kubernetes.io/version: "1.4.2"
    spec:
      containers:
        - name: payments-api
          image: registry.example.com/retail/payments-api:1.4.2
          ports:
            - containerPort: 8080
        # --- added: the health sidecar ---
        - name: health-sidecar
          image: registry.example.com/platform/health-sidecar:1.0.0
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: cs-health-sidecar
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: CS_SERVICE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.labels['app.kubernetes.io/name']
            - name: CS_VERSION
              valueFrom:
                fieldRef:
                  fieldPath: metadata.labels['app.kubernetes.io/version']
          ports:
            - name: cs-status
              containerPort: 9465
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: cs-status
            periodSeconds: 30
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
