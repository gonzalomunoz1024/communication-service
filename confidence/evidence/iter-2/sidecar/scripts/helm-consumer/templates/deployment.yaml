apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments-api
  labels:
    app.kubernetes.io/name: payments-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: payments-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: payments-api
        app.kubernetes.io/version: "1.4.2"
    spec:
      {{- if .Values.native }}
      initContainers:
        - name: db-migrate
          image: registry.example.com/retail/payments-api:1.4.2
          command: ["./migrate"]
        {{- include "cs-health-sidecar.initContainer" . | nindent 8 }}
      {{- end }}
      containers:
        - name: payments-api
          image: registry.example.com/retail/payments-api:1.4.2
          ports:
            - containerPort: 8080
        {{- if not .Values.native }}
        {{- include "cs-health-sidecar.container" . | nindent 8 }}
        {{- end }}
